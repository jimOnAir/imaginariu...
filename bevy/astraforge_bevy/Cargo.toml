[package]
name = "astraforge_bevy"
version = "0.20.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Play AstraForge game assets (GLB + af_bevy.json passport) in Bevy: default-clip autostart, clip blending, socket-mounted effects, studio sound banks, hot model reload."
repository = "https://github.com/Snodrod/AstraForge"
keywords = ["bevy", "gamedev", "astraforge", "glb", "asset"]
categories = ["game-development"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["3d", "audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
