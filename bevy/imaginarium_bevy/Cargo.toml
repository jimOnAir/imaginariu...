[package]
name = "imaginarium_bevy"
version = "0.20.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Play Imaginarium game assets (GLB + ima_bevy.json passport) in Bevy: default-clip autostart, clip blending, socket-mounted effects, studio sound banks, hot model reload."
repository = "https://github.com/jimOnAir/imaginarium"
keywords = ["bevy", "gamedev", "imaginarium", "glb", "asset"]
categories = ["game-development"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["3d", "audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The headless package validator (0.6.10 wave ticket 30): the bin below needs the full default
# plugin set (window + renderer) the user-facing crate deliberately does not drag in.
[features]
check = ["bevy/default"]

[[bin]]
name = "imaginarium_bevy_check"
path = "src/bin/imaginarium_bevy_check.rs"
required-features = ["check"]
