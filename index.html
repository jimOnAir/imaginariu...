<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#131719"/><script>/* theme before first paint (ticket 04): the stored preference decides the data-theme attribute before any stylesheet runs */(function(){try{var p=localStorage.getItem('astra.theme');if(p==='system')p=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script><title>AstraForge — local 3D studio</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
