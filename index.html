<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#131719"/><script>/* theme before first paint (ticket 04): the stored preference decides the data-theme attribute before any stylesheet runs */(function(){try{var p=localStorage.getItem('imaginarium.theme');if(p==='system')p=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',p==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script><title>Imaginarium — local 3D studio</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"/><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"/></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
