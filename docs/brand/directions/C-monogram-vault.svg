      <path d="M14 26 C14 8, 40 8, 46 20 C52 32, 78 32, 84 20 C90 8, 114 8, 114 26 C114 44, 90 44, 84 32 C78 20, 52 20, 46 32 C40 44, 14 44, 14 26 Z" stroke="#E7E5E4" stroke-width="9"/>
      <circle cx="46" cy="32" r="5.5" fill="#7DD3FC" stroke="none"/>
      <circle cx="84" cy="32" r="5.5" fill="#7DD3FC" stroke="none"/>
