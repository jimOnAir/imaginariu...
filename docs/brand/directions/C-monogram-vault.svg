  <text x="64" y="532" fill="#7DD3FC" font-size="15" letter-spacing="12" font-family="Inter, system-ui, sans-serif">LOCAL 3D STUDIO</text>

  <g transform="translate(760,140)" font-family="Inter, system-ui, sans-serif">
    <text x="0" y="0" fill="#8FA3B8" font-size="14" letter-spacing="2">PALETTE</text>
    <g transform="translate(0,16)">
      <rect width="88" height="56" rx="8" fill="#101418" stroke="#2A3440"/><text x="6" y="86" fill="#64748B" font-size="12">#101418</text>
      <rect x="104" width="88" height="56" rx="8" fill="#1C2229"/><text x="110" y="86" fill="#64748B" font-size="12">#1C2229</text>
      <rect x="208" width="88" height="56" rx="8" fill="#E7E5E4"/><text x="214" y="86" fill="#64748B" font-size="12">#E7E5E4</text>
      <rect x="312" width="88" height="56" rx="8" fill="#7DD3FC"/><text x="318" y="86" fill="#64748B" font-size="12">#7DD3FC</text>
    </g>
