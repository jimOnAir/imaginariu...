  </defs>
  <text x="60" y="70" fill="#8FA3B8" font-size="20" letter-spacing="6" font-family="Inter, system-ui, sans-serif">DIRECTION C — MONOGRAM VAULT</text>
  <text x="60" y="96" fill="#4A5A6A" font-size="14" font-family="Inter, system-ui, sans-serif">an idea that renders itself · editorial, archival, quiet</text>

  <g transform="translate(60,150) scale(1.9)"><use href="#loop"/></g>
