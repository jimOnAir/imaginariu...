  <text x="60" y="480" font-size="72" font-weight="700"><tspan fill="#E2E8F0">imagi</tspan><tspan fill="url(#pv2)">narium</tspan></text>
  <text x="62" y="512" fill="#64748B" font-size="16" letter-spacing="6">LOCAL 3D STUDIO</text>

  <g transform="translate(760,140)">
