    <g id="prism">
      <polygon points="64,8 118,40 118,104 64,136 10,104 10,40" fill="none"/>
      <polygon points="64,8 118,40 64,72 10,40" fill="#14B8A6"/>
      <polygon points="10,40 64,72 64,136 10,104" fill="#0E3B45"/>
      <polygon points="118,40 118,104 64,136 64,72" fill="#8B5CF6"/>
