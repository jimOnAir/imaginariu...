      <polyline points="10,104 64,72 118,104" stroke="#E2E8F0" stroke-width="2" fill="none" opacity=".35"/>
    </g>
  </defs>
  <text x="60" y="70" fill="#94A3B8" font-size="20" letter-spacing="4">DIRECTION A — FORGE PRISM</text>
  <text x="60" y="96" fill="#475569" font-size="14">generated geometry, engineered light · dark-first</text>

  <g transform="translate(60,140) scale(1.4)"><use href="#prism"/></g>
  <g transform="translate(300,340)"><g transform="scale(.3125)"><use href="#prism"/></g></g>
  <g transform="translate(360,392)"><g transform="scale(.09375)"><use href="#prism"/></g></g>
