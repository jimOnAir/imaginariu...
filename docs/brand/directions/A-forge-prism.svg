<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="640" fill="#131719"/>
  <defs>
    <linearGradient id="pv" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0E3B45"/><stop offset=".5" stop-color="#14B8A6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="pv2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#8B5CF6"/>
