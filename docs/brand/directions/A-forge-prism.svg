    <g transform="translate(0,16)">
      <rect width="88" height="56" rx="8" fill="#131719" stroke="#334155"/><text x="6" y="86" fill="#64748B" font-size="12">#131719</text>
      <rect x="104" width="88" height="56" rx="8" fill="#0E3B45"/><text x="110" y="86" fill="#64748B" font-size="12">#0E3B45</text>
      <rect x="208" width="88" height="56" rx="8" fill="#14B8A6"/><text x="214" y="86" fill="#64748B" font-size="12">#14B8A6</text>
      <rect x="312" width="88" height="56" rx="8" fill="#8B5CF6"/><text x="318" y="86" fill="#64748B" font-size="12">#8B5CF6</text>
    </g>
    <g transform="translate(0,140)">
